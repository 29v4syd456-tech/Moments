<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Moments · Tus momentos. Tus personas. Tus recuerdos.</title><meta name="description" content="Moments: guarda tus mejores momentos con las personas que quieres.">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1a2f;--mut:#6d6a80;--line:#ebe6dd;--a:#ff6b57;--b:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13111f;--card:#1e1b30;--ink:#f4f1ff;--mut:#a29fb8;--line:#2d2945}}
:root[data-theme=dark]{--bg:#13111f;--card:#1e1b30;--ink:#f4f1ff;--mut:#a29fb8;--line:#2d2945}
html,body{height:100%}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:.6rem 1rem;background:var(--line);transition:.2s}button:active{transform:scale(.95)}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.pri{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:600}.gh{background:none;border:1.5px solid var(--line)}.sm{padding:.3rem .6rem;font-size:.85rem}
input,textarea,select{width:100%;padding:.65rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin:.2rem 0 .6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1rem;margin:0 0 .9rem}.mut{color:var(--mut);font-size:.9rem}
.wrap{max-width:720px;margin:auto;padding:1rem 1rem 6rem}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;gap:6px}.ph{aspect-ratio:1;border-radius:12px;position:relative;cursor:pointer}.ph.pk,.ph.on{outline:3px solid var(--a)}.ph.on:after{content:"✓";position:absolute;right:4px;top:2px;color:#fff;font-weight:700}
h1,h2,h3{margin:.2rem 0 .5rem;line-height:1.15}.logo{font-weight:800;font-size:1.3rem;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{padding:2.5rem 0 1rem;text-align:center}.hero h1{font-size:clamp(2.2rem,8vw,3.8rem)}.hero p{max-width:34em;margin:0 auto 1.2rem;color:var(--mut)}
.mock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:2rem auto;animation:fl 6s ease-in-out infinite}.mock .ph:nth-child(2){transform:rotate(3deg)}.mock .ph:nth-child(5){transform:rotate(-3deg)}@keyframes fl{50%{transform:translateY(-8px)}}
.steps{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));z-index:5}.nav button{flex:1;background:none;font-size:.72rem;padding:.3rem}.nav button b{display:block;font-size:1.3rem}.nav .on{color:var(--a);font-weight:700}
@media(min-width:900px){.nav{top:0;right:auto;width:96px;flex-direction:column;justify-content:center;border-top:0;border-right:1px solid var(--line)}.app .wrap{margin-left:max(110px,calc(50% - 360px + 48px))}}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}.md{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:1.1rem;animation:up .25s}@media(min-width:700px){.ov{align-items:center}.md{border-radius:24px}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.msg{display:flex;gap:.5rem;margin:.6rem 0}.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}.bub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.5rem .8rem;max-width:80%}.msg.me{flex-direction:row-reverse}.q{border-left:3px solid var(--b);padding-left:.5rem;color:var(--mut);font-size:.85rem}
.bub .ph{width:160px;aspect-ratio:4/3}
.cg{max-width:420px;margin:auto}.t2,.th{grid-template-columns:repeat(2,1fr)}.th{grid-template-columns:repeat(3,1fr)}.th .ph{aspect-ratio:3/4}.t4{grid-template-columns:repeat(2,1fr)}.t6,.t9,.talb{grid-template-columns:repeat(3,1fr)}.talb .ph:first-child{grid-column:span 2;grid-row:span 2}.tv{grid-template-columns:1fr}.tv .ph{aspect-ratio:3/1}
.tpol{grid-template-columns:repeat(2,1fr);gap:14px}.tpol .ph{border:8px solid #fff;border-bottom-width:26px;transform:rotate(-3deg);border-radius:4px}.tpol .ph:nth-child(even){transform:rotate(3deg)}
.book{aspect-ratio:3/4;max-width:300px;margin:auto;border-radius:6px 18px 18px 6px;padding:1.2rem;box-shadow:-6px 6px 20px #0003;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:.5rem;text-align:center}.book.pg{background:var(--card);color:var(--ink);justify-content:flex-start;text-align:left}
.chip{padding:.3rem .8rem;border-radius:99px;background:var(--line);white-space:nowrap}.chip.on{background:var(--a);color:#fff}.scr{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:99px;opacity:0;transition:.3s;z-index:20;pointer-events:none;max-width:90%}#toast.on{opacity:1;transform:translate(-50%,0)}
.demo{background:#ffe9a8;color:#5b4500;border-radius:12px;padding:.5rem .8rem;font-size:.85rem;margin-bottom:.8rem}.err{color:#d6314a;font-size:.9rem}summary{cursor:pointer;font-weight:600;padding:.3rem 0}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:2rem 0}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="root"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gr=i=>`background:linear-gradient(135deg,hsl(${i*53%360} 85% 68%),hsl(${(i*53+50)%360} 80% 58%))`;
const MO=[['Junio',34,5],['Julio',82,12],['Agosto',64,9]],DAYS=['Sáb 14','Dom 15','Vie 20'];
const PEOPLE=['@laura','@mario','@sara','@lucia'];
let S={v:'landing',tab:'home',g:null,gt:'chat',m:null,me:{name:'Tú',user:'@tu_usuario',bio:'Guardando momentos ✨',email:''},auth:'register',ob:0,sel:[],mem:[],blocked:['@spam_user'],revive:true,priv:'group',
pool:Array.from({length:12},(_,i)=>gr(i+1)),reply:null,
groups:[{id:1,n:'Verano 2026',e:'☀️',d:'Playa, risas y atardeceres',m:['Laura','Mario','Sara','Tú'],adm:'Tú',msgs:[{u:'Laura',t:'¡Subí las fotos de la playa! 📸',h:'18:02',r:[]},{u:'Mario',t:'Qué buenas 😍',h:'18:05',r:['❤️']}]},{id:2,n:'Familia',e:'❤️',d:'Los de siempre',m:['Mamá','Papá','Tú'],adm:'Mamá',msgs:[]},{id:3,n:'Viaje a Marruecos',e:'✈️',d:'Ruta y planes',m:['Sara','Tú'],adm:'Tú',msgs:[]}],
posts:[{id:1,u:'@lucia',t:'Atardecer en Bilbao',i:20,l:24,c:['Precioso 😍']},{id:2,u:'@mario',t:'Mi collage del finde',i:31,l:9,c:[]}],
notifs:[['Laura ha añadido 8 fotos a Verano 2026',1],['Mario te ha enviado un mensaje',1],['Has sido añadido al grupo Familia ❤️',0],['Alguien reaccionó a tu recuerdo',0]]};
const grp=()=>S.groups.find(x=>x.id==S.g),R=()=>{$('#root').innerHTML=V[S.v]()+(S.m?`<div class=ov data-a=ov><div class=md role=dialog aria-modal=true>${M[S.m]()}</div></div>`:'')};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
const tiles=(a,c=4)=>`<div class=grid style="grid-template-columns:repeat(${c},1fr)">${a.map(i=>`<div class=ph style="${S.pool[i%S.pool.length]}"></div>`).join('')}</div>`;
const foot=`<footer>Created by Maryam Tekki · <a href="mailto:maryamtekki6@gmail.com" style="color:inherit">maryamtekki6@gmail.com</a></footer>`;
const demo=`<div class=demo>🧪 Modo demo: sin servidor, no se crea ninguna cuenta real ni se guarda nada al recargar.</div>`;
const V={
landing:()=>`<div class=wrap><div class="row sp"><span class=logo>moments</span><button class=gh data-a=go data-v=auth data-x=login>Entrar</button></div>
<section class=hero><h1>Tus momentos.<br>Tus personas.<br>Tus recuerdos.</h1><p>Guarda tus mejores momentos, compártelos con las personas que quieres y conviértelos en recuerdos que puedas volver a vivir.</p><div class="row" style="justify-content:center"><button class=pri data-a=go data-v=auth data-x=register>Crear mi espacio</button><button class=gh data-a=go data-v=app>Explorar</button></div>
<div class=mock>${[1,2,3,4,5,6].map(i=>`<div class=ph style="${gr(i*3)}"></div>`).join('')}</div><p class=mut>📸 fotos · 👥 grupos · 💬 chat · 📖 álbumes · 🖼️ collages</p></section>
<div class=steps>${[['👥','Crea tu grupo','Privado por defecto.'],['📸','Comparte tus momentos','Fotos, vídeos y audios.'],['🗂️','Guarda tus recuerdos','Año → mes → día.'],['✨','Crea algo especial','Collages y cuadernitos.'],['🔁','Revive tus mejores momentos','Cuando tú quieras.']].map((s,i)=>`<div class=card><h3>${s[0]} ${i+1}. ${s[1]}</h3><span class=mut>${s[2]}</span></div>`).join('')}</div>${foot}</div>`,
auth:()=>{const a=S.auth;return`<div class=wrap style="max-width:420px"><button class=gh data-a=go data-v=landing>← Volver</button><h2 style="margin-top:1rem">${{register:'Crear mi espacio',login:'Iniciar sesión',recover:'Recuperar contraseña'}[a]}</h2>${demo}<form data-f=${a} novalidate>
${a=='register'?`<label>Nombre<input name=n autocomplete=name></label><label>Usuario<input name=u placeholder="tu_usuario" autocomplete=username></label>`:''}<label>Email<input name=e type=email autocomplete=email></label>${a!='recover'?`<label>Contraseña<input name=p type=password autocomplete=current-password></label>`:''}
${a=='register'?`<label class=row><input type=checkbox name=age style="width:auto"> Tengo 14 años o más (o permiso de mi tutor)</label>`:''}<p class=err id=err role=alert></p><button class="pri" style="width:100%">${{register:'Crear cuenta',login:'Entrar',recover:'Enviar enlace'}[a]}</button></form>
<p class=mut>${a!='login'?`<a href=# data-a=auth data-x=login>Ya tengo cuenta</a>`:`<a href=# data-a=auth data-x=register>Crear cuenta</a> · <a href=# data-a=auth data-x=recover>Olvidé mi contraseña</a>`}</p></div>`},
ob:()=>{const s=S.ob,c=[`<h2>Crea tu perfil</h2><input id=on value="${esc(S.me.name)}" aria-label=Nombre><input id=ob2 value="${esc(S.me.bio)}" aria-label=Descripción>`,`<h2>Crea o únete a un grupo</h2><input id=og placeholder="Ej. Mis amigas 👯"><p class=mut>Será privado por defecto.</p>`,`<h2>Invita a tus personas</h2><div class=card>Enlace de ejemplo: <b>moments.app/i/ejemplo</b></div><button class=gh data-a=copy>Copiar enlace</button><p class=mut>Los enlaces reales necesitan backend.</p>`,`<h2>Empieza a guardar momentos</h2><p>Todo listo. Tu espacio es privado.</p>`];
return`<div class=wrap style="max-width:460px"><div class=row>${[0,1,2,3].map(i=>`<span class=chip style="padding:2px 14px;${i<=s?'background:var(--a)':''}"></span>`).join('')}</div><p class=mut>Paso ${s+1} de 4</p>${c[s]}<div class="row sp"><button class=gh data-a=obb ${s?'':'disabled'}>Atrás</button><button class=pri data-a=obn>${s==3?'Entrar':'Siguiente'}</button></div></div>`},
app:()=>`<div class=app><div class=wrap>${S.set?Set():S.g?Group():T[S.tab]()}${foot}</div><nav class=nav aria-label=Principal>${[['home','🏠','Inicio'],['mom','✨','Momentos'],['grp','👥','Grupos'],['dis','🌎','Descubrir'],['per','👤','Perfil']].map(t=>`<button data-a=tab data-t=${t[0]} class="${S.tab==t[0]&&!S.g?'on':''}"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav></div>`};
const head=t=>`<div class="row sp"><span class=logo>${t}</span><span><button class=sm data-a=m data-m=search aria-label=Buscar>🔍</button> <button class=sm data-a=m data-m=notifs aria-label=Notificaciones>🔔${S.notifs.some(n=>n[1])?'•':''}</button></span></div>`;
const cta=`<button class=pri data-a=m data-m=create>✨ Crear recuerdo</button>`;
const T={
home:()=>`${head('moments')}<h2 style="margin-top:1rem">Hola, ${esc(S.me.name)} 👋</h2>${demo}${S.revive?`<div class=card><b>Hace un año ☀️</b><p class=mut>Así fue vuestro verano…</p>${tiles([1,2,3,4],4)}<button class="sm gh" data-a=rv>Ocultar</button></div>`:''}${cta}<h3 style="margin-top:1.2rem">Actividad</h3>${S.notifs.slice(0,3).map(n=>`<div class=card>${esc(n[0])}</div>`).join('')}`,
mom:()=>`${head('Momentos')}<div class="scr" style="margin:.8rem 0">${S.groups.map(g=>`<button class="chip ${S.g==g.id||(!S.g&&g.id==1)?'on':''}" data-a=mg data-id=${g.id}>${g.e} ${esc(g.n)}</button>`).join('')}</div>${cta}${TL(S.groups.find(g=>g.id==(S.mg||1)))}`,
grp:()=>`${head('Grupos')}<button class="pri" style="margin:.8rem 0" data-a=m data-m=newg>＋ Nuevo grupo</button>${S.groups.length?S.groups.map(g=>`<div class="card row sp" data-a=og data-id=${g.id} style="cursor:pointer"><span><b>${g.e} ${esc(g.n)}</b><br><span class=mut>🔒 Privado · ${g.m.length} personas</span></span><span>›</span></div>`).join(''):`<div class=card>Aún no tienes grupos. Crea el primero 👆</div>`}`,
dis:()=>`${head('Descubrir')}<p class=mut>🌎 Solo contenido que sus autores han decidido hacer público. Nada de los grupos privados aparece aquí.</p>${S.posts.filter(p=>!S.blocked.includes(p.u)).map(p=>`<div class=card><div class="row sp"><b>${esc(p.u)}</b><button class="sm" data-a=rep data-id=${p.id} aria-label="Denunciar">⋯</button></div><div class=ph style="${gr(p.i)};aspect-ratio:4/3;margin:.5rem 0"></div><b>${esc(p.t)}</b><div class=row style="margin:.4rem 0"><button class=sm data-a=lk data-id=${p.id}>${p.k?'❤️':'🤍'} ${p.l+(p.k?1:0)}</button><button class=sm data-a=cm data-id=${p.id}>💬 ${p.c.length}</button><button class=sm data-a=sh data-id=${p.id}>↗️</button><button class=sm data-a=sv data-id=${p.id}>${p.s?'🔖 Guardado':'🔖'}</button>${p.mine?`<button class=sm data-a=dp data-id=${p.id}>🗑️</button>`:''}</div>${p.c.map(c=>`<div class=mut>💬 ${esc(c)}</div>`).join('')}${p.o?`<form data-f=cm data-id=${p.id}><input name=c placeholder="Escribe un comentario" aria-label=Comentario></form>`:''}</div>`).join('')||`<div class=card>No hay publicaciones.</div>`}`,
per:()=>`${head('Perfil')}<div class="card" style="text-align:center;margin-top:1rem"><div class=av style="width:72px;height:72px;margin:auto;font-size:1.8rem">${esc(S.me.name[0]||'T')}</div><h2>${esc(S.me.name)}</h2><span class=mut>${esc(S.me.user)}</span><p>${esc(S.me.bio)}</p><button class=gh data-a=set>⚙️ Configuración</button></div>
<div class=card><b>Mis grupos</b><p class=mut>${S.groups.map(g=>g.e+' '+esc(g.n)).join(' · ')||'Ninguno'}</p></div><div class=card><b>Mis publicaciones</b><p class=mut>${S.posts.filter(p=>p.mine).length||'Aún no has publicado nada.'}</p></div>
<h3>Recuerdos creados</h3>${S.mem.length?S.mem.map((m,i)=>`<div class=card><b>${m.k} ${esc(m.t)}</b><label class=mut>Visibilidad<select data-a=pv data-i=${i}>${[['p','🔒 Privado'],['g','👥 Solo mi grupo'],['w','🌎 Público']].map(o=>`<option value=${o[0]} ${m.v==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>${m.v=='w'?`<button class=pri data-a=pub data-i=${i}>Publicar en Descubrir</button>`:''}</div>`).join(''):`<div class=card>Aún no has creado recuerdos. ${cta}</div>`}`};
function TL(g){if(!g)return'';return`<h3 style="margin-top:1rem">${g.e} ${esc(g.n)} · 2026</h3>${MO.map(m=>`<details class=card><summary>${m[0].toUpperCase()} · ${m[1]} fotos · ${m[2]} vídeos</summary>${DAYS.map((d,i)=>`<p class=mut>${d} · ${3+i} fotos</p>${tiles([...Array(4)].map((_,k)=>k+i*3+MO.indexOf(m)))}`).join('')}</details>`).join('')}`}
function Group(){const g=grp();return`<div class="row sp"><button class=gh data-a=back>←</button><b>${g.e} ${esc(g.n)}</b><button class=sm data-a=m data-m=invite>➕ Invitar</button></div><p class=mut>🔒 Privado · ${esc(g.d)}</p><div class=row>${[['chat','💬 Chat'],['mom','📸 Momentos'],['mem','👥 Miembros']].map(t=>`<button class="chip ${S.gt==t[0]?'on':''}" data-a=gt data-t=${t[0]}>${t[1]}</button>`).join('')}</div>${S.gt=='chat'?`<div id=msgs>${Msgs(g)}</div>${S.reply!=null?`<p class=q>Respondiendo a: ${esc(g.msgs[S.reply].t||'foto')} <a href=# data-a=nr>✕</a></p>`:''}<div class=row style="margin-top:.6rem"><label class="chip" style="cursor:pointer">📎<input type=file id=fi accept="image/*,video/*" hidden></label><button class=sm data-a=audio aria-label=Audio>🎤</button><button class=sm data-a=emo aria-label=Emojis>😊</button><input id=ci style="flex:1;width:auto;margin:0" placeholder="Escribe un mensaje" aria-label=Mensaje></div><button class=pri style="margin-top:.5rem;width:100%" data-a=send>Enviar</button>`:S.gt=='mom'?TL(g):`<div class=card>${g.m.map(m=>`<div class=row style="margin:.4rem 0"><span class=av>${esc(m[0])}</span>${esc(m)}${m==g.adm?' <span class=chip>admin</span>':''}</div>`).join('')}</div><button class=gh data-a=cf data-x=leave>Abandonar grupo</button>`}`}
function Msgs(g){return g.msgs.length?g.msgs.map((m,i)=>`<div class="msg ${m.u=='Tú'?'me':''}"><span class=av>${esc(m.u[0])}</span><div class=bub><b>${esc(m.u)}</b> <span class=mut>${m.h}</span>${m.q?`<div class=q>${esc(m.q)}</div>`:''}<div>${m.img?`<div class=ph style="${m.img}"></div>`:esc(m.t)}${m.s?' ⭐':''}</div>${m.r.length?`<div>${m.r.join('')}</div>`:''}<span><button class=sm data-a=mr data-i=${i}>↩️</button><button class=sm data-a=mh data-i=${i}>❤️</button><button class=sm data-a=ms data-i=${i}>⭐</button></span></div></div>`).join(''):`<div class=card>Este chat está vacío. Escribe el primer mensaje 👋</div>`}
function Set(){const sw=(k,t)=>`<label class=row><input type=checkbox style="width:auto" data-a=tg data-k=${k} ${S[k]?'checked':''}> ${t}</label>`;return`<button class=gh data-a=set data-off=1>← Perfil</button><h2>Configuración</h2>
<details class=card open><summary>Editar perfil</summary><form data-f=prof><input name=n value="${esc(S.me.name)}" aria-label=Nombre><input name=b value="${esc(S.me.bio)}" aria-label=Descripción><button class=pri>Guardar</button></form></details>
<details class=card><summary>Privacidad</summary><p class=mut>Visibilidad por defecto de lo nuevo:</p><select data-a=dv><option value=p>🔒 Privado</option><option value=g selected>👥 Solo mi grupo</option></select>${sw('revive','Mostrar “Revive este momento”')}<p class=mut>Cuentas de menores: sin datos personales públicos.</p></details>
<details class=card><summary>Notificaciones</summary>${sw('nt1','Mensajes')}${sw('nt2','Fotos nuevas')}</details>
<details class=card><summary>Seguridad</summary><p class=mut>Cambiar contraseña requiere backend de autenticación (aún no conectado).</p><button class=gh data-a=toast data-x="Necesita backend de autenticación">Cambiar contraseña</button></details>
<details class=card><summary>Usuarios bloqueados</summary>${S.blocked.map(b=>`<div class="row sp">${b}<button class=sm data-a=ub data-u=${b}>Desbloquear</button></div>`).join('')||'<p class=mut>Nadie bloqueado.</p>'}</details>
<details class=card><summary>Gestionar grupos</summary>${S.groups.map(g=>`<div class="row sp">${g.e} ${esc(g.n)}<button class=sm data-a=cf data-x=leave data-id=${g.id}>Abandonar</button></div>`).join('')||'<p class=mut>Sin grupos.</p>'}</details>
<button class=gh data-a=out>Cerrar sesión</button> <button class=gh data-a=cf data-x=del style="color:#d6314a">Eliminar cuenta</button>`}
